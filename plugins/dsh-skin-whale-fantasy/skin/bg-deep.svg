<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#070d1c"/>
      <stop offset="0.5" stop-color="#05070d"/>
      <stop offset="1" stop-color="#04060b"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.12" cy="-0.08" r="0.72">
      <stop offset="0" stop-color="#3a7bff" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#3a7bff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#3a7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp2" cx="0.94" cy="0.06" r="0.6">
      <stop offset="0" stop-color="#39ffd1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#39ffd1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a7bff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#3a7bff" stop-opacity="0.16"/>
      <stop offset="0.62" stop-color="#39ffd1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#39ffd1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fine" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1e3a6b" stroke-opacity="0.55" stroke-width="1"/>
    </pattern>
    <mask id="fade">
      <radialGradient id="fadeG" cx="0.5" cy="0.45" r="0.78">
        <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
        <stop offset="0.6" stop-color="#fff" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <rect width="1600" height="1000" fill="url(#fadeG)"/>
    </mask>
  </defs>

  <rect width="1600" height="1000" fill="url(#sea)"/>
  <rect width="1600" height="1000" fill="url(#lamp)"/>
  <rect width="1600" height="1000" fill="url(#lamp2)"/>
  <rect width="1600" height="1000" fill="url(#fine)" mask="url(#fade)" opacity="0.55"/>

  <!-- 极光带：两条扁平弧，压到很淡，只给空气感 -->
  <path d="M-120 620C180 380 520 300 860 372s520 190 900 66" fill="none" stroke="url(#veil)" stroke-width="120" stroke-linecap="round" opacity="0.55"/>
  <path d="M-80 790C260 600 640 560 980 624s440 96 760 6" fill="none" stroke="url(#veil)" stroke-width="56" stroke-linecap="round" opacity="0.35"/>

  <!-- 鲸：背脊 + 尾鳍，只留线 -->
  <g fill="none" stroke="#3a7bff" stroke-opacity="0.3" stroke-width="2">
    <path d="M120 812c74-58 172-86 286-84 96 2 168 24 236 54 46 20 84 26 118 14 22-8 38-24 48-46 8 26 26 42 50 48-30 14-52 34-62 62-34 14-72 10-108-10-58-32-124-52-206-56-108-6-206 20-282 74"/>
    <path d="M900 690c40-40 92-58 156-54" stroke-opacity="0.18"/>
  </g>
  <path d="M120 812c74-58 172-86 286-84 96 2 168 24 236 54 46 20 84 26 118 14 22-8 38-24 48-46 8 26 26 42 50 48-30 14-52 34-62 62-34 14-72 10-108-10-58-32-124-52-206-56-108-6-206 20-282 74z"
        fill="#3a7bff" fill-opacity="0.05"/>

  <!-- 星点：疏而小，只在下半部几颗 -->
  <g fill="#e8f1ff">
    <circle cx="248" cy="176" r="1.6" opacity="0.5"/>
    <circle cx="612" cy="118" r="1.2" opacity="0.35"/>
    <circle cx="1018" cy="220" r="1.8" opacity="0.45"/>
    <circle cx="1348" cy="150" r="1.3" opacity="0.3"/>
    <circle cx="1462" cy="392" r="1.5" opacity="0.35"/>
    <circle cx="418" cy="330" r="1.2" opacity="0.28"/>
    <circle cx="820" cy="470" r="1.4" opacity="0.22"/>
    <circle cx="156" cy="486" r="1.2" opacity="0.24"/>
  </g>
  <g fill="#39ffd1">
    <circle cx="1180" cy="300" r="1.7" opacity="0.45"/>
    <circle cx="700" cy="640" r="1.5" opacity="0.3"/>
  </g>
</svg>
